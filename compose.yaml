name: sijjel-web

# Joins the API stack's network, so start sijjel-api first:
# (cd ../sijjel-api && docker compose --profile app up -d)
services:
  web:
    build: .
    environment:
      API_URL: http://api:8080
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - api

networks:
  api:
    name: sijjel-api_default
    external: true
